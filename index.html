<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="no-referrer" />
        <title>Authenticating...</title>
        <style>
            :root {
                --bg-color: #ffffff;
                --text-color: #333333;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg-color: #222222;
                    --text-color: #ffffff;
                }
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-color);
                font-family: sans-serif;
            }
        </style>
        <title>Authenticating...</title>
    </head>
    <body>
        <script>
            (() => {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get("code");
                const state = urlParams.get("state");

                if (!code) {
                    document.body.innerHTML = `<h2>no auth code?</h2>\n<a href="https://github.com/TBroz15/wails-auth-google-api/blob/main/README.md" target="_blank" rel="noopener noreferrer">what is this?</a>`;
                    return;
                }

                if (!state) {
                    document.body.innerHTML = "<h2>no state?</h2>";
                    return;
                }

                document.body.innerHTML = `<p>Authenticating...</p>`;
                window.location.replace(
                    `http://wails.localhost/auth?code=${code}&state=${state}`,
                );
            })();
        </script>
    </body>
</html>
